# References only: values are created by the Crossplane claims (mongodb-claim.yaml, mysql-claim.yaml)
# in their connection secrets and synced here by External Secrets at deploy time.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: nodejs-goof-mongodb-conn
  labels:
    app.kubernetes.io/name: nodejs-goof
    app.kubernetes.io/instance: nodejs-goof-dev
    app.kubernetes.io/part-of: app-migration-wave
    app.kubernetes.io/managed-by: platform-gitops
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-dev
  target:
    name: nodejs-goof-mongodb-conn
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: nodejs-goof-mongodb-claim-conn
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: nodejs-goof-mysql-conn
  labels:
    app.kubernetes.io/name: nodejs-goof
    app.kubernetes.io/instance: nodejs-goof-dev
    app.kubernetes.io/part-of: app-migration-wave
    app.kubernetes.io/managed-by: platform-gitops
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-dev
  target:
    name: nodejs-goof-mysql-conn
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: nodejs-goof-mysql-claim-conn
