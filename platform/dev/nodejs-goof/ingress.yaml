apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nodejs-goof
  labels:
    app.kubernetes.io/name: nodejs-goof
    app.kubernetes.io/instance: nodejs-goof-dev
    app.kubernetes.io/part-of: app-migration-wave
    app.kubernetes.io/managed-by: platform-gitops
    platform.internal/network-zone: internet
spec:
  ingressClassName: internet
  tls:
    - hosts:
        - nodejs-goof.dev.platform.internal
      secretName: nodejs-goof-tls
  rules:
    - host: nodejs-goof.dev.platform.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nodejs-goof
                port:
                  name: http
