# Crossplane claim: MongoDB 3.6 (the app's mongoose 4.2 / mongodb 2.0 driver needs the legacy wire protocol).
apiVersion: database.example.org/v1alpha1
kind: MongoDBInstance
metadata:
  name: nodejs-goof-mongodb
  labels:
    app.kubernetes.io/name: nodejs-goof
    app.kubernetes.io/instance: nodejs-goof-dev
    app.kubernetes.io/part-of: app-migration-wave
    app.kubernetes.io/managed-by: platform-gitops
spec:
  parameters:
    engineVersion: "3.6"
    storageGB: 10
  compositionSelector:
    matchLabels:
      provider: aws
      engine: mongodb
  writeConnectionSecretToRef:
    name: nodejs-goof-mongodb-claim-conn
