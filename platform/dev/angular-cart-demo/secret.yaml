# Reference only: the value is synced from the platform secret store at deploy time.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: angular-cart-demo-secrets
  labels:
    app.kubernetes.io/name: angular-cart-demo
    app.kubernetes.io/instance: angular-cart-demo-dev
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: app-migration-wave
    app.kubernetes.io/managed-by: platform-gitops
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-secret-store
  target:
    name: angular-cart-demo-secrets
    creationPolicy: Owner
  data:
    - secretKey: SESSION_SECRET
      remoteRef:
        key: dev/angular-cart-demo
        property: SESSION_SECRET
