# References only: values live in the platform secret store and are synced
# into the Secret realdreamteam-secrets at deploy time.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: realdreamteam-secrets
  labels:
    app.kubernetes.io/name: realdreamteam
    app.kubernetes.io/instance: realdreamteam-dev
    app.kubernetes.io/part-of: realdreamteam
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-secrets
  target:
    name: realdreamteam-secrets
    creationPolicy: Owner
  data:
    - secretKey: AUCTION_DATABASE_URL
      remoteRef:
        key: platform/dev/realdreamteam
        property: AUCTION_DATABASE_URL
    - secretKey: AUCTION_DATABASE_PASSWORD
      remoteRef:
        key: platform/dev/realdreamteam
        property: AUCTION_DATABASE_PASSWORD
    - secretKey: COOKIE_SECRET
      remoteRef:
        key: platform/dev/realdreamteam
        property: COOKIE_SECRET
    - secretKey: ACCESS_CODE
      remoteRef:
        key: platform/dev/realdreamteam
        property: ACCESS_CODE
    - secretKey: ADMIN_CODE
      remoteRef:
        key: platform/dev/realdreamteam
        property: ADMIN_CODE
