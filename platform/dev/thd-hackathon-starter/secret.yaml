# Values come from the platform secret store at deploy time; nothing literal lives here.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: thd-hackathon-starter
  labels:
    app.kubernetes.io/name: thd-hackathon-starter
    app.kubernetes.io/instance: thd-hackathon-starter-dev
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: app-migration-wave
    app.kubernetes.io/managed-by: platform-dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-secrets
  target:
    name: thd-hackathon-starter
    creationPolicy: Owner
  data:
    - secretKey: cookieSigningKey
      remoteRef:
        key: platform/dev/thd-hackathon-starter
        property: cookieSigningKey
