apiVersion: apps/v1
kind: Deployment
metadata:
  name: thd-hackathon-starter
  labels:
    app.kubernetes.io/name: thd-hackathon-starter
    app.kubernetes.io/instance: thd-hackathon-starter-dev
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: app-migration-wave
    app.kubernetes.io/managed-by: platform-dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: thd-hackathon-starter
      app.kubernetes.io/instance: thd-hackathon-starter-dev
  template:
    metadata:
      labels:
        app.kubernetes.io/name: thd-hackathon-starter
        app.kubernetes.io/instance: thd-hackathon-starter-dev
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: app-migration-wave
        app.kubernetes.io/managed-by: platform-dev
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: registry.platform.internal/thd-hackathon-starter@sha256:814d4f16b20e264a2a5c61a1eb13c79f7deb668b4b132101631b821169937c53
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: thd-hackathon-starter
          env:
            # Connection details written by the MongoDBInstance claim (mongodb.yaml).
            - name: MONGO_USERNAME
              valueFrom:
                secretKeyRef:
                  name: thd-hackathon-starter-mongodb
                  key: username
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: thd-hackathon-starter-mongodb
                  key: password
            - name: MONGO_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: thd-hackathon-starter-mongodb
                  key: endpoint
            - name: MONGO_PORT
              valueFrom:
                secretKeyRef:
                  name: thd-hackathon-starter-mongodb
                  key: port
            - name: mongoUrl
              value: mongodb://$(MONGO_USERNAME):$(MONGO_PASSWORD)@$(MONGO_ENDPOINT):$(MONGO_PORT)/$(MONGO_DATABASE)?$(MONGO_OPTIONS)
            - name: cookieSigningKey
              valueFrom:
                secretKeyRef:
                  name: thd-hackathon-starter
                  key: cookieSigningKey
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
